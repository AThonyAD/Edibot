name: Data MVP validation

on:
  pull_request:
    paths:
      - 'data-mvp/**'
      - 'docs/data-*.md'
      - '.github/workflows/data-mvp.yml'
  push:
    paths:
      - 'data-mvp/**'
      - 'docs/data-*.md'
      - '.github/workflows/data-mvp.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r data-mvp/requirements.txt
      - run: python data-mvp/tools/validate.py
      - run: python -m unittest discover -s data-mvp/tests -v
      - name: Check CSV candidate conversion
        run: |
          python data-mvp/tools/import_csv.py data-mvp/examples/publisher-submission.csv --source-id source-ci-example --received-on 2026-11-04 --output /tmp/edibot-candidate.json
          python data-mvp/tools/validate.py /tmp/edibot-candidate.json --submission
